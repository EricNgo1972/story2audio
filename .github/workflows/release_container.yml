name: Release Container

# Builds a versioned container image for story2audio and pushes it to GHCR, for the provisioning
# system to `docker pull` + `docker run` per tenant. Mirrors MaplePOS's release_container.yml, minus
# the sibling-repo checkout — story2audio is self-contained, so the Dockerfile builds from source.
#
# Division of labour with deploy.yml:
#   deploy.yml               every push to main -> :edge, :<sha>   (continuous, unpinned)
#   this workflow (manual)   an explicit version -> :<version>, :latest
# so :latest only ever moves when someone deliberately cuts a release. Pin catalog rows to the
# version tag regardless; :latest is a convenience, not a deployment target.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version / image tag (e.g. 3.1.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ericngo1972/story2audio   # GHCR image names must be lowercase

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APP_VERSION is baked in as a build arg so /health reports the tag the tenant is actually
      # running (main.py:48 reads it), rather than the hard-coded default in the source.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ inputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ inputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`$IMAGE:${{ inputs.version }}\` and \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Catalog row -> ImageRepository=$IMAGE, ImageTag=${{ inputs.version }}, InternalPort=8000" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tenant volume mounts at \`/data\` (audio cache). Health endpoint: \`/health\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Single replica per tenant — in-flight TTS job state is per-process." >> "$GITHUB_STEP_SUMMARY"
